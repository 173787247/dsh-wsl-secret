- insert:
    - id: dsh-wsl-secret
      name: dsh-wsl-secret
      config:
        enabled: true
        timeoutMs: 15000
        # REQUIRED for reads — empty blocks everything (safe default).
        # pass: "dsh" allows dsh/openrouter; age: "~/secrets" filesystem root
        allowPrefixes: []
        # Prefer secret_to_env; keep reveal false
        reveal: false
